[project]
name = "MIDI-To-Strudel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
"mido"
]

[project.scripts]
midi-to-strudel = "midi_to_strudel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["midi_to_strudel.py"]
